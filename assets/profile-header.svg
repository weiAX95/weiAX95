<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">weiAX95 — Frontend engineering and AI applications</title>
  <desc id="desc">A dark profile banner with a softly animated gradient line and orbiting accents.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset=".55" stop-color="#111c35"/>
      <stop offset="1" stop-color="#102b37"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5eead4"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b8c4e3" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="panel"><rect x="1" y="1" width="1198" height="258" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1200" height="260" fill="url(#background)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <circle cx="1040" cy="130" r="146" fill="#38bdf8" opacity=".08"/>
    <circle cx="1040" cy="130" r="95" fill="none" stroke="#7dd3fc" stroke-opacity=".32"/>
    <circle cx="1040" cy="130" r="65" fill="none" stroke="#a5b4fc" stroke-opacity=".22"/>
    <g>
      <circle cx="1040" cy="35" r="5" fill="#5eead4"/>
      <circle cx="1040" cy="225" r="3" fill="#a5b4fc"/>
    </g>
    <path d="M 0 226 C 180 198, 305 254, 490 228 S 895 194, 1200 218" fill="none" stroke="url(#accent)" stroke-opacity=".25" stroke-width="2"/>
    <text x="68" y="67" fill="#5eead4" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="4">HELLO, WORLD</text>
    <text x="64" y="139" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="750">I'm weiAX95<tspan fill="#5eead4">.</tspan></text>
    <text x="68" y="181" fill="#b7c6dc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">Frontend engineering  /  AI applications</text>
  </g>
  <rect x="1" y="1" width="1198" height="258" rx="22" fill="none" stroke="#8ab8d1" stroke-opacity=".22" stroke-width="2"/>
</svg>